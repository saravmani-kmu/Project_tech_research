  summary: >-
    We’ve observed agents discovering progressively more complex tool use while playing a simple
    game of hide-and-seek. Through training in our new simulated hide-and-seek environment, agents
    build a series of six distinct strategies and counterstrategies, some of which we did not kn…
  details: >-
    We’ve observed agents discovering progressively more complex tool use while playing a simple
    game of hide-and-seek. Through training in our new simulated hide-and-seek environment, agents
    build a series of six distinct strategies and counterstrategies, some of which we did not know
