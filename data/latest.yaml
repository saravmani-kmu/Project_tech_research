  details: >-
    With the incoming AI agents, I am pretty sure social media teams will be run mostly by these LLM
    bots. I am already observing accounts replying to every post on my feed.<p>Soon social media is
    going to be filled with bots posting content, and other bots commenting, re-sharing, and
    upvoting content. Quora already has an &quot;Assistant&quot; answering each and every
    question.<p>I am sure I will not stick around to scroll through such AI generated
    content.<p>With image generation models, even instagram is not going to be spared it seems.
