- id: rss-OpenAI-aHR0cHM6Ly9vcGVuYWkuY29t
  title: Video generation models as world simulators
  summary: >-
    We explore large-scale training of generative models on video data. Specifically, we train
    text-conditional diffusion models jointly on videos and images of variable durations,
    resolutions and aspect ratios. We leverage a transformer architecture that operates on spacetime
    patche…
  details: >-
    We explore large-scale training of generative models on video data. Specifically, we train
    text-conditional diffusion models jointly on videos and images of variable durations,
    resolutions and aspect ratios. We leverage a transformer architecture that operates on spacetime
    patches of video and image latent codes. Our largest model, Sora, is capable of generating a
    minute of high fidelity video. Our results suggest that scaling video generation models is a
    promising path towards building general purpose simulators of the physical world.
  url: https://openai.com/index/video-generation-models-as-world-simulators
  source: rss
