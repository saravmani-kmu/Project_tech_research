- id: hackernews-42174829
  title: 'Show HN: FastGraphRAG – Better RAG using good old PageRank'
  summary: >-
    Hey there HN! We’re Antonio, Luca, and Yuhang, and we’re excited to introduce Fast GraphRAG, an
    open-source RAG approach that leverages knowledge graphs and the 25 years old PageRank for
    better inform
  details: >-
    Hey there HN! We’re Antonio, Luca, and Yuhang, and we’re excited to introduce Fast GraphRAG, an
    open-source RAG approach that leverages knowledge graphs and the 25 years old PageRank for
    better information retrieval and reasoning.<p>Building a good RAG pipeline these days takes a
    lot of manual optimizations. Most engineers intuitively start from naive RAG: throw everything
    in a vector database and hope that semantic search is powerful enough. This can work for use
    cases where accuracy isn’t too important and hallucinations are tolerable, but it doesn’t work
    for more difficult queries that involve multi-hop reasoning or more advanced domain
    understanding. Also, it’s impossible to debug it.<p>To address these limitations, many engineers
    find themselves adding extra layers like agent-based preprocessing, custom embeddings, reranking
    mechanisms, and hybrid search strategies. Much like the early days of machine learning when we
    manually crafted feature vectors to squeeze out marginal gains, building an effective RAG system
    often becomes an exercise in crafting engineering “hacks.”<p>Earlier this year, Microsoft seeded
    the idea of using Knowledge Graphs for RAG and published GraphRAG - i.e. RAG with Knowledge
    Graphs. We believe that there is an incredible potential in this idea, but existing
    implementations are naive in the way they create and explore the graph. That’s why we developed
    Fast GraphRAG with a new algorithmic approach using good old PageRank.<p>There are two main
    challenges when building a reliable RAG system:<p>(1) Data Noise: Real-world data is often
    messy. Customer support tickets, chat logs, and other conversational data can include a lot of
    irrelevant information. If you push noisy data into a vector database, you’re likely to get
    noisy results.<p>(2) Domain Specialization: For complex use cases, a RAG system must understand
    the domain-specific context. This requires creating representations that capture not just the
    words but the deeper relationships and structures within the data.<p>Our solution builds on
    these insights by incorporating knowledge graphs into the RAG pipeline. Knowledge graphs store
    entities and their relationships, and can help structure data in a way that enables more
    accurate and context-aware information retrieval. 12 years ago Google announced the knowledge
    graph we all know about [1]. It was a pioneering move. Now we have LLMs, meaning that people can
    finally do RAG on their own data with tools that can be as powerful as Google’s original
    idea.<p>Before we built this, Antonio was at Amazon, while Luca and Yuhang were finishing their
    PhDs at Oxford. We had been thinking about this problem for years and we always loved the
    parallel between pagerank and the human memory [2]. We believe that searching for memories is
    incredibly similar to searching the web.<p>Here’s how it works:<p>- Entity and Relationship
    Extraction: Fast GraphRAG uses LLMs to extract entities and their relationships from your data
    and stores them in a graph format [3].<p>- Query Processing: When you make a query, Fast
    GraphRAG starts by finding the most relevant entities using vector search, then runs a
    personalized PageRank algorithm to determine the most important “memories” or pieces of
    information related to the query [4].<p>- Incremental Updates: Unlike other graph-based RAG
    systems, Fast GraphRAG natively supports incremental data insertions. This means you can
    continuously add new data without reprocessing the entire graph.<p>- Faster: These design
    choices make our algorithm faster and more affordable to run than other graph-based RAG systems
    because we eliminate the need for communities and clustering.<p>Suppose you’re analyzing a book
    and want to focus on character interactions, locations, and significant events:<p><pre><code> 
    from fast_graphrag import GraphRAG
      
      DOMAIN = &quot;Analyze this story and identify the characters. Focus on how they interact with each other, the locations they explore, and their relationships.&quot;
      
      EXAMPLE_QUERIES = [
          &quot;What is the significance of Christmas Eve in A Christmas Carol?&quot;,
          &quot;How does the setting of Victorian London contribute to the story&#x27;s themes?&quot;,
          &quot;Describe the chain of events that leads to Scrooge&#x27;s transformation.&quot;,
          &quot;How does Dickens use the different spirits (Past, Present, and Future) to guide Scrooge?&quot;,
          &quot;Why does Dickens choose to divide the story into \&quot;staves\&quot; rather than chapters?&quot;
      ]
      
      ENTITY_TYPES = [&quot;Character&quot;, &quot;Animal&quot;, &quot;Place&quot;, &quot;Object&quot;, &quot;Activity&quot;, &quot;Event&quot;]
      
      grag = GraphRAG(
          working_dir=&quot;.&#x2F;book_example&quot;,
          domain=DOMAIN,
          example_queries=&quot;\n&quot;.join(EXAMPLE_QUERIES),
          entity_types=ENTITY_TYPES
      )
      
      with open(&quot;.&#x2F;book.txt&quot;) as f:
          grag.insert(f.read())
      
      print(grag.query(&quot;Who is Scrooge?&quot;).response)
    </code></pre>

    This code creates a domain-specific knowledge graph based on your data, example queries, and
    specified entity types. Then you can query it in plain English while it automatically handles
    all the data fetching, entity extractions, co-reference resolutions, memory elections, etc. When
    you add new data, locking and checkpointing is handled for you as well.<p>This is the kind of
    infrastructure that GenAI apps need to handle large-scale real-world data. Our goal is to give
    you this infrastructure so that you can focus on what’s important: building great apps for your
    users without having to care about manually engineering a retrieval pipeline. In the managed
    service, we also have a suite of UI tools for you to explore and debug your knowledge
    graph.<p>We have a free hosted solution with up to 100 monthly requests. When you’re ready to
    grow, we have paid plans that scale with you. And of course you can self host our open-source
    engine.<p>Give us a spin today at <a
    href="https:&#x2F;&#x2F;circlemind.co">https:&#x2F;&#x2F;circlemind.co</a> and see our code at
    <a
