- id: hackernews-41451698
  title: 'Show HN: Laminar – Open-Source DataDog + PostHog for LLM Apps, Built in Rust'
  summary: >-
    Hey HN, we’re Robert, Din and Temirlan from Laminar (<a
    href="https:&#x2F;&#x2F;www.lmnr.ai">https:&#x2F;&#x2F;www.lmnr.ai</a>), an open-source
    observability and analytics platform for complex LLM app
  details: >-
    Hey HN, we’re Robert, Din and Temirlan from Laminar (<a
    href="https:&#x2F;&#x2F;www.lmnr.ai">https:&#x2F;&#x2F;www.lmnr.ai</a>), an open-source
    observability and analytics platform for complex LLM apps. It’s designed to be fast, reliable,
    and scalable. The stack is RabbitMQ for message queues, Postgres for storage, Clickhouse for
    analytics, Qdrant for semantic search - all powered by Rust.<p>How is Laminar different from the
    swarm of other “LLM observability” platforms?<p>On the observability part, we’re focused on
    handling full execution traces, not just LLM calls. We built a Rust ingestor for OpenTelemetry
    (Otel) spans with GenAI semantic conventions. As LLM apps get more complex (think Agents with
    hundreds of LLM and function calls, or complex RAG pipelines), full tracing is critical. With
    Otel spans, we can: 1. Cover the entire execution trace. 2. Keep the platform future-proof 3.
    Leverage an amazing OpenLLMetry (<a
    href="https:&#x2F;&#x2F;github.com&#x2F;traceloop&#x2F;openllmetry">https:&#x2F;&#x2F;github.com&#x2F;traceloop&#x2F;openllmetry</a>),
    open-source package for span production.<p>The key difference is that we tie text analytics
    directly to execution traces. Rich text data makes LLM traces unique, so we let you track
    “semantic metrics” (like what your AI agent is actually saying) and connect those metrics to
    where they happen in the trace. If you want to know if your AI drive-through agent made an
    upsell, you can design an LLM extraction pipeline in our builder (more on it later), host it on
    Laminar, and handle everything from event requests to output logging. Processing requests simply
    come as events in the Otel span.<p>We think it’s a win to separate core app logic from LLM event
    processing. Most devs don’t want to manage background queues for LLM analytics processing but
    still want insights into how their Agents or RAGs are working.<p>Our Pipeline Builder uses graph
    UI where nodes are LLM and util functions, and edges showing data flow. We built a custom task
    execution engine with support of parallel branch executions, cycles and branches (it’s overkill
    for simple pipelines, but it’s extremely cool and we’ve spent a lot of time designing a robust
    engine). You can also call pipelines directly as API endpoints. We found them to be extremely
    useful for iterating on and separating LLM logic. Laminar also traces pipeline directly, which
    removes the overhead of sending large outputs over the network.<p>One thing missing from all LLM
    observability platforms right now is an adequate search over traces. We’re attacking this
    problem by indexing each span in a vector DB and performing hybrid search at query time. This
    feature is still in beta, but we think it’s gonna be crucial part of our platform going
    forward.<p>We also support evaluations. We loved the “run everything locally, send results to a
    server” approach from Braintrust and Weights &amp; Biases, so we did that too: a simple SDK and
    nice dashboards to track everything. Evals are still early, but we’re pushing hard on
    them.<p>Our goal is to make Laminar the Supabase for LLMOps - the go-to open-source
    comprehensive platform for all things LLMs &#x2F; GenAI. In it’s current shape, Laminar is just
    few weeks old and developing rapidly, we’d love any feedback or for you to give Laminar a try in
    your LLM projects!
