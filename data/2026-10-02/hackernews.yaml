- id: hackernews-42697592
  title: 'Ask HN: Continue with SaaS type platform, or pursue AI?'
  summary: >-
    I&#x27;m building a collaborative platform for improving sanity (efficiency) when working on
    complex projects, and with all the AI hype I spent some time diving into LLMs, agents, etc.<p>My
    key takeaw
  details: >-
    I&#x27;m building a collaborative platform for improving sanity (efficiency) when working on
    complex projects, and with all the AI hype I spent some time diving into LLMs, agents, etc.<p>My
    key takeaway after spending a couple months on it is that inaccuracy is really the biggest
    killer.<p>Here are some key takeaways after talking to some people as well as doing my own
    projects:<p>1. 1hr meeting&#x27;s AI gen minutes (zoom&#x2F;teams&#x2F;etc). It makes a dozen or
    so points but some of them are not relevant to the meeting at all, and some folks have heavy
    accents and their input is mostly incorrectly captured. Folks ended up just using manual minutes
    again because these are important for their workflow.<p>2. Creating embeddings of
    files&#x2F;documentation&#x2F;messages&#x2F;etc and then searching on them seems to work well.
    For the most part, it seems these can be 60-80% accurate because the alternative is even worse
    (try searching a huge slack for a file, or even software made for file management). However,
    when it doesn&#x27;t work, it is really bad because I get wildly unrelated results.<p>3. Not
    very accurate for anything involving calculations or open ended questions about numeric data,
    granted this is a known limitation. Creating a graph or something like that? Sure. Asking it
    about those figures or trying to derive some additional information seems to be hit or
    miss.<p>So I&#x27;m a little stuck. I feel like if I stick with a SaaS platform, it won&#x27;t
    be appealing in the current landscape where everyone is hammering AI into their products.
    Personally I find most of the gen AI not that useful - like when I open up a project management
    tool and the description box has an AI button.<p>NL input seems to instill a sense of false
    confidence - I will get what I ask. But when it doesn&#x27;t work, especially after effort
    placed into the prompt, people just revert to the vanilla experience.<p>So what am I missing? Am
    I just thinking the wrong way? Maybe I just suck at setting vision for the future based on my
    own experience with these tools.<p>Any thoughts would be helpful. Thanks!
  url: https://news.ycombinator.com/item?id=42697592
