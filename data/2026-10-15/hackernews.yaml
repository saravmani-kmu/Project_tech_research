  title: 'Show HN: Millwright – Rust-based, self-hosted LLM router'
  summary: >-
    Hey HN,<p>With the news of OpenRouter possibly being acquired and proliferation of hosted LLM
    routers (i.e. Ramp Router, Vercel’s AI Gateway), I saw the need for a self hosted solution
    focused on cost
  details: >-
    Hey HN,<p>With the news of OpenRouter possibly being acquired and proliferation of hosted LLM
    routers (i.e. Ramp Router, Vercel’s AI Gateway), I saw the need for a self hosted solution
    focused on cost savings, transparency, and performance. So, I built an open sourced router with
    a simple CLI interface that can easily sit between coding agents and GenAI workloads.<p>For the
    curious and lazy, at the moment, Millwright has the tools for,<p>- Providers: OpenAI-compatible
    APIs, Anthropic, Amazon Bedrock<p>- Routing: policy-controlled model roles (cheap, mid,
    frontier), cheapest healthy route selection<p>- Protocols: OpenAI Chat Completions, Anthropic
    Messages, text and tool translation<p>- Cache Affinity: role-scoped session lanes without
    serializing concurrent agent traffic<p>- Spend Tracking: per-team costs, cache usage,
    model&#x2F;provider mix, request traces<p>- Cost Analysis: measured usage and modeled candidate
    economics (HTML, Markdown, JSON)<p>- Reliability: bounded failover, circuit breakers, timeouts,
    concurrency limits<p>- Setup: interactive provider, model, and pricing configuration without
    storing provider secrets<p>- Deployment: one Rust binary, Docker, SQLite or PostgreSQL<p>Full
    disclosure: parts of the codebase were built with AI coding agents. All feedback is welcome, I’d
    especially value feedback on the routing policy, provider coverage, and anything that would
    block you from self-hosting it. Feel free to open feature&#x2F;request and&#x2F;or contribute as
    well.
