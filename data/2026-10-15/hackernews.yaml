- id: hackernews-43812336
  title: 'Show HN: Mirror AI – LLM agent that takes action, not just chat'
  summary: >-
    Hi HN,<p>TL;DR  Mirror AI is a cross-platform desktop <i>action oriented LLM</i>.  

    Instead of just replying with text, it can run terminal commands, move files, hit APIs, send
    email&#x2F;messages, sc
  details: >-
    Hi HN,<p>TL;DR  Mirror AI is a cross-platform desktop <i>action oriented LLM</i>.  

    Instead of just replying with text, it can run terminal commands, move files, hit APIs, send
    email&#x2F;messages, schedule calendar events, query databases etc. - and chain those steps in
    one request.<p>Why I built it  

    Chatbots are great for answers but stop at the “OK, now go do it” moment.  

    I was copy-pasting between ChatGPT and my shell&#x2F;IDE&#x2F;Gmail far too often, so on red-eye
    flights I hacked a bridge that lets an LLM execute tasks under a permission layer. Friends asked
    for it, feature-creep happened, and here we are.<p>What it can do today  

    - Files &amp; Shell – read&#x2F;write&#x2F;rename&#x2F;compress&#x2F;execute files, run shell
    commands  

    - Productivity – draft + send Gmail, create Google Calendar events, read&#x2F;write Notion, post
    to Slack&#x2F;Discord&#x2F;WhatsApp (via Beeper)  

    - Dev&#x2F;Ops – query Postgres&#x2F;Mongo, interact with GitHub, call AWS, curl any REST
    endpoint  

    - Search&#x2F;GenAI – web search (Perplexity), summarise PDFs, generate images&#x2F;video, keep
    long-term memory

    - Extensible via MCP (Modular Command Protocol) to add your own skills

    - And a lot more<p>Example prompt after you have added a few integrations
    (copy-paste):<p><pre><code>  Search Reddit for discussion on LangChain streaming, summarise it,
    email me the summary, and block 30 min in Calendar tomorrow.
      
      OR

      Investigate my AWS account and tell me how to easily save money. Also check my MongoDB and make some proposition to optimize it.

    </code></pre>

    How it works  

    - Desktop app (macOS, Windows, Linux) written in TS  

    - No SaaS backend: everything runs locally; outbound calls only hit the model provider you
    configure (OpenAI, Claude, local Ollama, etc.)  

    - Safety: every risky actions require approval from the user<p>Status &amp; roadmap  

    - Free alpha download: <a href="https:&#x2F;&#x2F;themirrorai.com"
    rel="nofollow">https:&#x2F;&#x2F;themirrorai.com</a>  (bring your own API keys)  

    - Planning to open-source core in the coming months after tidying up if there is enough interest

    - Up next: improved working memory, event-driven triggers for autonomous responses, and expanded
    integrations.<p>Ask  

    Kick the tires, try weird edge-cases, look for security holes, and tell me what hurts or what
    you wish it did. I will be in the thread checking the comments.<p>Thanks!  

    Sat
